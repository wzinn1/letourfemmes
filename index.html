<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Femmes - Classificação</title>
  <style>
    /* Aqui vem o css */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;      
    }
 
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f7f8f1;
    }
 
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 90px;
      background: #26311a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8%;
      transition: height 0.4s;
      z-index: 10;
    }
 
    nav.pequena {
      height: 55px;
    }

    nav a {
        color: #FFF;
        text-decoration: none;
        margin-left: 20px;
    }

    .logo {
        font-weight: bold;
        color: #c8e477;
    }

    .hero {
        height: 100vh;
        background: linear-gradient(135deg, #d6e69e, #FFF);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 25px;
    }

    .hero h1 {
        font-size: clamp(36px, 7vw, 80px);
        margin-bottom: 10px;
    }

    .hero p {
        font-size: 22px;
    }

    section {
        padding: 80px 8%;
    }

    h2 {
        font-size: 32px;
    }

    .tabela-scroll {
        overflow-x: auto;
    }

    table {
        width: 100%;
        background: #FFF;
        border-collapse: collapse;
    }

    th {
        background: #8bae22;
        color: #FFF;
    }

    td, th {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;

    }

  </style>
</head>
<body>
  <nav id="navBar">
    <div class="logo">Le Tour Femmes</div>
    <div>
      <a href="#classificacao">Classificação</a>
      <a href="#graficos">Gráficos</a>
      <a href="#sobre">Sobre</a>
    </div>
  </nav>
 
  <header class="hero">
    <div>
      <h1>General Classification</h1>
      <p>CLassificação após a etapa 6</p>
      <a href="#classificacao">Ver Classificação</a>
    </div>
  </header>
   
  <main>
    <section id="classificacao">
      <h2>Classificação Geral</h2>
      <p>Clica num ciclista para ver os seus detalhes</p>
      <div class="tabela-scroll">
        <table>
          <thead>
            <tr>
              <th>Posição</th>
              <th>Nome</th>
              <th>Equipa</th>
              <th>Tempo</th>
            </tr>
          </thead>
          <tbody>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="modal" class="modal">
    <div class="modal-card">
      <button id="fechar">x</button>
    </div>
  </div>
  <script>
    // Aqui vem o javascript
    const navBar = document.getElementById('navBar');
 
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navBar.classList.add("pequena");
      } else {
        navBar.classList.remove("pequena");
      }
    });
  </script>
</body>
</html>
